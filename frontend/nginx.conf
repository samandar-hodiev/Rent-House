# Serves the built SPA and proxies the API and uploaded files to the backend
# container, so the browser sees one origin and CORS never enters into it —
# see backend/internal/middleware/cors.go, which still applies to anyone
# calling the API directly rather than through here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React Router owns every path that is not a real file or one of the
    # locations below; nginx's job is to hand it index.html and let the
    # client-side router decide what the URL means.
    location / {
        try_files $uri /index.html;
    }

    # proxy_http_version and the Upgrade headers matter here even though most
    # of this location is plain HTTP: /api/v1/ws is a websocket, and this is
    # the one block it passes through.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Listing photographs and other uploads, served by the backend from
    # UPLOAD_DIR rather than baked into this image.
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
    }
}
